[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "registry-guardian"
version = "0.1.1"
requires-python = ">=3.11"
dependencies = ["pydantic>=2,<3", "PyYAML>=6", "jsonschema>=4"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9",
       "azure-containerregistry>=1.2", "azure-identity>=1.19", "mcp>=1.0,<2",
       "microsoft-teams-apps>=2.1,<3", "azure-functions>=1.20", "httpx>=0.28"]
azure = ["azure-containerregistry>=1.2", "azure-identity>=1.19"]
llm = ["litellm>=1.60"]
mcp = ["mcp>=1.0,<2"]
teams = ["microsoft-teams-apps>=2.1,<3", "azure-functions>=1.20"]

[project.scripts]
guardian = "guardian.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.coverage.run]
source = ["guardian"]
